replicaCount: 2

image:
  repository: pulse-api        # set to <acr>.azurecr.io/pulse-api or <acct>.dkr.ecr.<region>.amazonaws.com/pulse-api
  tag: dev
  pullPolicy: IfNotPresent

cloud: local                    # azure | aws | local — shown by the app at /

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx              # nginx on kind/AKS; "alb" on EKS with the AWS Load Balancer Controller
  host: ""                      # empty = match any host
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi               # no CPU limit on purpose (avoids throttling) — interview talking point

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
