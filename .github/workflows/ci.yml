# CI: test -> build -> scan -> push (main only).
# Week 6 adds: terraform plan on PRs, OIDC login to AWS/Azure, deploy jobs with approval.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform/
      - name: validate bootstrap + env roots
        run: |
          for d in terraform/bootstrap/azure terraform/bootstrap/aws terraform/envs/azure terraform/envs/aws; do
            echo "::group::$d"
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
            echo "::endgroup::"
          done

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: pulse-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy run from its container image. Supply-chain hygiene (an interview talking point):
      # pin scanner versions, ideally by digest, and only bump after checking the release is legitimate.
      - name: Scan image (fail on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.67.2 image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            pulse-api:${{ github.sha }}

      - name: Push to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/pulse-api"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag pulse-api:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"
